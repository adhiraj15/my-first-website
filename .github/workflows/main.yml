
name: Docker Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-website:1.0 .

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy website to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "$HOME/my-first-website/.git" ]; then
              git clone https://github.com/adhiraj15/my-first-website.git "$HOME/my-first-website"
            else
              cd "$HOME/my-first-website"
              git pull origin main
            fi

            cd "$HOME/my-first-website"

            sudo docker build -t my-website:latest .
            sudo docker stop my-website || true
            sudo docker rm my-website || true
            sudo docker run -d --name my-website --restart unless-stopped -p 80:80 my-website:latest
